<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACADEX - Recover Password</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="forgot-password">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-circle">A</div>
        <div>
          <h1>ACADEX</h1>
          <p>Password Recovery</p>
        </div>
      </div>
      <p class="auth-intro">Reset security credentials for accessing academic files.</p>
      
      <form id="forgot-form" class="auth-form">
        
        <!-- Step 1: Input Email -->
        <div id="email-step">
          <div class="field-group">
            <label for="email">Account Email</label>
            <input id="email" name="email" type="email" placeholder="e.g. admin@acadex.edu" required />
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 16px;">Generate Verification Code</button>
        </div>

        <!-- Step 2: Input Simulated OTP -->
        <div id="otp-step" class="hidden">
          <div style="background: var(--warning-light); border: 1px solid var(--warning); padding: 14px; border-radius: var(--radius-md); text-align: center; margin-bottom: 16px;">
            <p style="font-size: 0.85rem; color: var(--text-muted); font-weight: 600;">[SIMULATION] Verification Code Sent:</p>
            <strong id="mock-otp" style="font-size: 1.6rem; color: var(--warning); letter-spacing: 2px;">######</strong>
          </div>
          <div class="field-group">
            <label for="otp-code">Enter OTP Code</label>
            <input id="otp-code" type="text" placeholder="6-digit code" maxlength="6" />
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 16px;">Verify Code</button>
        </div>

        <!-- Step 3: Input New Password -->
        <div id="reset-step" class="hidden">
          <div class="field-group">
            <label for="new-password">New Password</label>
            <input id="new-password" name="new-password" type="password" placeholder="••••••••" minlength="6" />
          </div>
          <div class="field-group">
            <label for="confirm-new-password">Confirm New Password</label>
            <input id="confirm-new-password" name="confirm-new-password" type="password" placeholder="••••••••" />
          </div>
          <button type="submit" class="btn btn-primary btn-full" style="margin-top: 16px;">Reset Password</button>
        </div>

        <div id="error-message" class="error-message"></div>
        
        <div class="auth-footer" style="justify-content: center; margin-top: 8px;">
          <a href="login.html">Back to Sign In</a>
        </div>
      </form>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
