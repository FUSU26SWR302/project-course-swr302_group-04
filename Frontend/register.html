<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ACADEX - Account Registration</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body data-page="register">
  <main class="auth-page">
    <div class="auth-card">
      <div class="auth-brand">
        <div class="logo-circle">A</div>
        <div>
          <h1>ACADEX</h1>
          <p>Registration Portal</p>
        </div>
      </div>
      <p class="auth-intro">Create a new academic account to join the university management system.</p>
      <form id="register-form" class="auth-form">
        <div class="field-group">
          <label for="full-name">Full Name</label>
          <input id="full-name" name="full-name" type="text" placeholder="Enter your full name" required />
        </div>
        <div class="field-group">
          <label for="email">Email Address</label>
          <input id="email" name="email" type="email" placeholder="e.g. name@acadex.edu" required />
        </div>
        <div class="field-group">
          <label for="role">Portal Role</label>
          <select id="role" name="role" required>
            <option value="student">Student</option>
            <option value="teacher">Teacher</option>
            <option value="admin">Administrator</option>
          </select>
        </div>
        <div class="field-group">
          <label for="password">Password</label>
          <input id="password" name="password" type="password" placeholder="••••••••" required minlength="6" />
        </div>
        <div class="field-group">
          <label for="confirm-password">Confirm Password</label>
          <input id="confirm-password" name="confirm-password" type="password" placeholder="••••••••" required />
        </div>
        <div id="error-message" class="error-message"></div>
        <button type="submit" class="btn btn-primary btn-full">Register Account</button>
        <div class="auth-footer" style="justify-content: center; margin-top: 8px;">
          <span style="color: var(--text-muted); margin-right: 6px;">Already have an account?</span>
          <a href="login.html">Sign In</a>
        </div>
      </form>
    </div>
  </main>
  <script src="js/script.js"></script>
</body>
</html>
